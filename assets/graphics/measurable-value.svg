<g class="mobile-condition"><circle cx="34" cy="538" r="7" fill="#f8f8f4" stroke="#b8995f"/><text x="62" y="534" font-family="IBM Plex Mono" font-size="13" letter-spacing="1.3" fill="#112a3f">04 FINANCIAL</text><text x="62" y="556" font-size="14" fill="#5d6b78">Prove the economics through implementation.</text><circle class="condition-hit" data-condition="3" role="button" tabindex="0" aria-label="04 Financial readiness condition" aria-pressed="false" cx="34" cy="538" r="20"/></g>
<g class="mobile-condition"><circle cx="34" cy="634" r="7" fill="#f8f8f4" stroke="#b8995f"/><text x="62" y="630" font-family="IBM Plex Mono" font-size="13" letter-spacing="1.3" fill="#112a3f">05 SYSTEMS</text><text x="62" y="652" font-size="14" fill="#5d6b78">Connect technology to operating reality.</text><circle class="condition-hit" data-condition="4" role="button" tabindex="0" aria-label="05 Systems readiness condition" aria-pressed="false" cx="34" cy="634" r="20"/></g>
