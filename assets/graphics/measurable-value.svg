<g class="mobile-condition"><circle cx="34" cy="250" r="7" fill="#f8f8f4" stroke="#b8995f"/><text x="62" y="246" font-family="IBM Plex Mono" font-size="13" letter-spacing="1.3" fill="#112a3f">01 STRATEGY</text><text x="62" y="268" font-size="14" fill="#5d6b78">Define the business problem and outcome.</text><circle class="condition-hit" data-condition="0" role="button" tabindex="0" aria-label="01 Strategy readiness condition" aria-pressed="true" cx="34" cy="250" r="20"/></g>
<g class="mobile-condition"><circle cx="34" cy="346" r="7" fill="#f8f8f4" stroke="#b8995f"/><text x="62" y="342" font-family="IBM Plex Mono" font-size="13" letter-spacing="1.3" fill="#112a3f">02 WORKFLOWS</text><text x="62" y="364" font-size="14" fill="#5d6b78">Understand decisions, handoffs, and exceptions.</text><circle class="condition-hit" data-condition="1" role="button" tabindex="0" aria-label="02 Workflows readiness condition" aria-pressed="false" cx="34" cy="346" r="20"/></g>
